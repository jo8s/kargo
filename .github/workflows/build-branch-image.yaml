name: Build Branch Image

# Manual, throwaway image build for testing a branch against a real cluster,
# without needing a working local container-build toolchain. Pushes to your
# own fork's GHCR namespace (ghcr.io/<owner>/kargo), never akuity/kargo.
#
# Trigger from the Actions tab (choose the branch to build) or via:
#   gh workflow run build-branch-image.yaml --ref <branch> -f tag=<tag>

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish'
        required: false
        default: 'branch-test'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:3.0.0
        ports:
        - 5000:5000
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      with:
        driver-opts: network=host
    - name: Login to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build base image
      run: |
        BASE_IMAGE=localhost:5000/kargo-base make build-base-image
        docker push localhost:5000/kargo-base:latest-arm64
        docker push localhost:5000/kargo-base:latest-amd64
    - name: Build and push final image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        platforms: linux/amd64
        build-args: |
          BASE_IMAGE=localhost:5000/kargo-base
          VERSION=${{ github.event.inputs.tag }}
          GIT_COMMIT=${{ github.sha }}
          GIT_TREE_STATE=clean
        tags: ghcr.io/${{ github.repository_owner }}/kargo:${{ github.event.inputs.tag }}
        push: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: false
        sbom: false
